<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura | Reality Mapping</title>
  
  <!-- 1. 样式表路径：去掉前面的斜杠，改为相对路径 -->
  <link rel="stylesheet" href="index.css">

  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. 引入 Babel：让浏览器能实时编译 TSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes breathe {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .animate-breathe {
      animation: breathe 2s ease-in-out infinite;
    }
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    body {
      background-color: #F8F9FA;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #007AFF33; border-radius: 10px; }
  </style>

  <!-- 3. Import Map 在线环境中有时不稳定，建议在代码里直接 import -->
</head>
<body>
  <div id="root"></div>

  <!-- 4. 关键修改：
       - type 改为 "text/babel"
       - src 路径去掉前面的斜杠，改为 "./index.tsx" 
       - 添加 data-type="module" 允许在里面使用 import
  -->
  <script type="text/babel" data-type="module" src="./index.tsx"></script>
</body>
</html>
